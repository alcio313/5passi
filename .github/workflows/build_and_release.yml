name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android Release (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Prepare Release Artifacts
        run: |
          mkdir -p release_assets
          cp build/app/outputs/flutter-apk/app-release.apk release_assets/5passi-app-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release_assets/5passi-app-release.aab

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5passi-android-binaries
          path: release_assets/*
          retention-days: 30

      # Create or update Release when pushing a version tag (e.g. v1.0.0)
      - name: Create GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/5passi-app-release.apk
            release_assets/5passi-app-release.aab
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Automatic rolling pre-release on every push to main
      - name: Publish Rolling Latest Release (on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 5passi - Latest Build
          prerelease: true
          files: |
            release_assets/5passi-app-release.apk
            release_assets/5passi-app-release.aab
          body: |
            🚀 **Ultima versione compilata di 5passi** generata automaticamente da GitHub Actions.
            
            ### 📥 Download Pacchetti:

            #### 📱 Mobile (Android & iOS):
            * [📲 **5passi-app-release.apk**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-app-release.apk) (Installabile direttamente su Android)
            * [📦 **5passi-app-release.aab**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-app-release.aab) (Bundle per Google Play Store)
            * [🍏 **5passi-ios-unsigned.ipa**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-ios-unsigned.ipa) (Pacchetto per iPhone / iPad)
            
            #### 🖥️ Desktop (Windows, Linux, macOS):
            * [🪟 **5passi-windows-x64.zip**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-windows-x64.zip) (Windows 10/11 64-bit portable - estrai e avvia `5passi.exe`)
            * [🐧 **5passi-linux-x64.tar.gz**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-linux-x64.tar.gz) (Linux x64 nativo GTK)
            * [🍎 **5passi-macos.zip**](https://github.com/${{ github.repository }}/releases/download/latest/5passi-macos.zip) (macOS `.app` bundle)
            
            *Realizzato con **Google Antigravity**.*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-apple:
    name: Build Apple (iOS IPA & macOS App)
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build iOS Application (Unsigned Release)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA
        run: |
          mkdir -p release_apple/Payload
          cp -r build/ios/iphoneos/Runner.app release_apple/Payload/
          (cd release_apple && zip -qr 5passi-ios-unsigned.ipa Payload)

      - name: Build macOS Desktop Application
        run: |
          flutter config --enable-macos-desktop
          flutter build macos --release
          mkdir -p release_apple
          (cd build/macos/Build/Products/Release && zip -qr "$GITHUB_WORKSPACE/release_apple/5passi-macos.zip" *.app)

      - name: Upload Apple Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5passi-apple-binaries
          path: |
            release_apple/5passi-ios-unsigned.ipa
            release_apple/5passi-macos.zip
          retention-days: 30

      - name: Attach Apple Binaries to Rolling Latest Release (on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            release_apple/5passi-ios-unsigned.ipa
            release_apple/5passi-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Apple Binaries to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_apple/5passi-ios-unsigned.ipa
            release_apple/5passi-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows Desktop (x64 ZIP)
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "5passi-windows-x64.zip"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5passi-windows-binaries
          path: 5passi-windows-x64.zip
          retention-days: 30

      - name: Attach Windows to Rolling Latest Release (on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: 5passi-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Windows to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 5passi-windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Desktop (x64 TAR.GZ)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Archive
        run: |
          tar -czf 5passi-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: 5passi-linux-binaries
          path: 5passi-linux-x64.tar.gz
          retention-days: 30

      - name: Attach Linux to Rolling Latest Release (on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: 5passi-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach Linux to GitHub Release (on Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 5passi-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
